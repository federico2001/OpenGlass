[project]
name = "openglass-langchain"
version = "0.1.0"
description = "An OpenGlass integration for LangChain: classifies tool calls against an openglass-policy and opens an OpenGlass attestation for the risky ones."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["openglass", "langchain", "gen-ai", "risk-policy", "agents"]
authors = [{ name = "OpenGlass" }]
dependencies = ["openglass-core>=0.1.0", "langchain-core>=0.3.0"]

[project.urls]
Homepage = "https://github.com/federico2001/OpenGlass/tree/main/langchain-py"
Repository = "https://github.com/federico2001/OpenGlass"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openglass_langchain"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true

# openglass-sdk (import name `openglass`) doesn't ship a py.typed marker yet — see
# core-py/pyproject.toml for the same note.
[[tool.mypy.overrides]]
module = "openglass.*"
ignore_missing_imports = true
