[project]
name = "openglass-core"
version = "0.1.0"
description = "OpenGlass integration core: the reference openglass-policy evaluator, and (soon) the shared runtime an integration builds on."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
keywords = ["openglass", "ai-agents", "risk-policy", "opentelemetry", "gen-ai"]
authors = [{ name = "OpenGlass" }]
dependencies = ["PyYAML>=6.0"]

[project.urls]
Homepage = "https://github.com/federico2001/OpenGlass/tree/main/core-py"
Repository = "https://github.com/federico2001/OpenGlass"

[project.optional-dependencies]
dev = ["pytest>=8", "mypy>=1.11", "jsonschema>=4.23", "types-PyYAML", "types-jsonschema"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/openglass_core"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.mypy]
strict = true
